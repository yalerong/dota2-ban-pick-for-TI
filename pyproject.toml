[project]
name = "dota2-bp"
version = "0.1.0"
description = "Dota 2 Captain's Mode BP scouting - data foundation"
requires-python = ">=3.11"
dependencies = ["requests>=2.31", "pandas>=2.0", "pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
bp = "bp.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
